name: Crear APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la carpeta web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg icon-192.png icon-512.png www/

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: TorneoFacil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
